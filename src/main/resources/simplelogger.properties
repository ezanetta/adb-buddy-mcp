# slf4j-simple writes to System.err by default; keep it explicit, stdout belongs to the MCP transport.
org.slf4j.simpleLogger.logFile=System.err
# The SDK logs every registration at INFO; keep it to warnings and our own loggers at info.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.adb-buddy=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showShortLogName=true
